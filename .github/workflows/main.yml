name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project (supports root files, uploaded ZIP, or single HTML)
        shell: bash
        run: |
          set -e
          BUILD_DIR="."

          # Case 1: If settings.gradle.kts is not at root, check for an uploaded .zip archive
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" ! -path "./.git/*" | head -n 1 || true)
            if [ -n "$ZIP_FILE" ]; then
              echo "Detected uploaded ZIP archive: $ZIP_FILE — extracting..."
              mkdir -p _apk_workspace
              unzip -q -o "$ZIP_FILE" -d _apk_workspace
              BUILD_DIR="_apk_workspace"
            fi
          fi

          # Case 2: Find settings.gradle.kts (at root, inside extracted ZIP, or inside a subfolder)
          FOUND_SETTINGS=$(find "$BUILD_DIR" -maxdepth 4 -type f -name "settings.gradle.kts" ! -path "./.git/*" | head -n 1 || true)
          if [ -n "$FOUND_SETTINGS" ]; then
            BUILD_DIR=$(dirname "$FOUND_SETTINGS")
            echo "Found Android Gradle project in: $BUILD_DIR"
          else
            # Case 3: Standalone .html file uploaded directly from phone — auto-scaffold Android project!
            HTML_FILE=$(find . -maxdepth 3 -type f \( -iname "*.html" -o -iname "*.htm" \) ! -path "./.git/*" | head -n 1 || true)
            if [ -z "$HTML_FILE" ]; then
              echo "::error::No Android project, ZIP archive, or .html game file found in this repository. Upload either pixel-lane-moba-github-apk-repo.zip OR your .html game file to this repo."
              exit 1
            fi

            echo "Found standalone HTML game: $HTML_FILE — auto-scaffolding Android project..."
            BUILD_DIR="_apk_workspace"
            mkdir -p "$BUILD_DIR/app/src/main/assets"
            mkdir -p "$BUILD_DIR/app/src/main/java/com/pixellane/moba"
            mkdir -p "$BUILD_DIR/app/src/main/res/values"
            mkdir -p "$BUILD_DIR/app/src/main/res/mipmap-xxhdpi"

            cp "$HTML_FILE" "$BUILD_DIR/app/src/main/assets/index.html"
            echo "# ProGuard rules" > "$BUILD_DIR/app/proguard-rules.pro"

            cat <<'EOF_ROOT_GRADLE' > "$BUILD_DIR/build.gradle.kts"
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF_ROOT_GRADLE

            cat <<'EOF_SETTINGS' > "$BUILD_DIR/settings.gradle.kts"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Pixel Lane MOBA"
          include(":app")
          EOF_SETTINGS

            cat <<'EOF_PROPS' > "$BUILD_DIR/gradle.properties"
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_PROPS

            cat <<'EOF_APP_GRADLE' > "$BUILD_DIR/app/build.gradle.kts"
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.pixellane.moba"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.pixellane.moba"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              signingConfigs {
                  create("release") {
                      val keystoreFile = rootProject.file("keystore.jks")
                      if (keystoreFile.exists()) {
                          storeFile = keystoreFile
                          storePassword = System.getenv("KEYSTORE_PASSWORD") ?: "pixellane123"
                          keyAlias = System.getenv("KEY_ALIAS") ?: "pixellane"
                          keyPassword = System.getenv("KEY_PASSWORD") ?: "pixellane123"
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      val keystoreFile = rootProject.file("keystore.jks")
                      if (keystoreFile.exists()) {
                          signingConfig = signingConfigs.getByName("release")
                      }
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.3")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.12.1")
          }
          EOF_APP_GRADLE

            cat <<'EOF_MANIFEST' > "$BUILD_DIR/app/src/main/AndroidManifest.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Zero network permissions: app runs 100% offline from bundled APK assets -->

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.PixelLaneGame">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|uiMode"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF_MANIFEST

            cat <<'EOF_STRINGS' > "$BUILD_DIR/app/src/main/res/values/strings.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Pixel Lane MOBA</string>
          </resources>
          EOF_STRINGS

            cat <<'EOF_THEMES' > "$BUILD_DIR/app/src/main/res/values/themes.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.PixelLaneGame" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#0b0d16</item>
                  <item name="android:statusBarColor">#0b0d16</item>
                  <item name="android:navigationBarColor">#0b0d16</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF_THEMES

            cat <<'EOF_MAIN_KT' > "$BUILD_DIR/app/src/main/java/com/pixellane/moba/MainActivity.kt"
          package com.pixellane.moba

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.webkit.WebViewAssetLoader

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private var lastBackPressedMs: Long = 0L

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      window.attributes.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  hideSystemBars()

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#0b0d16"))
                      overScrollMode = View.OVER_SCROLL_NEVER
                      isHorizontalScrollBarEnabled = false
                      isVerticalScrollBarEnabled = false
                      setOnLongClickListener { true }
                      isLongClickable = false
                  }

                  val assetLoader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      builtInZoomControls = false
                      displayZoomControls = false
                      setSupportZoom(false)
                      allowFileAccess = false
                      allowContentAccess = false
                      cacheMode = WebSettings.LOAD_NO_CACHE
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(
                          view: WebView,
                          request: WebResourceRequest
                      ): WebResourceResponse? {
                          if (request.url.host != "appassets.androidplatform.net") {
                              // Strict offline mode: block all external network requests.
                              return WebResourceResponse("text/plain", "utf-8", null)
                          }
                          return assetLoader.shouldInterceptRequest(request.url)
                      }

                      override fun shouldOverrideUrlLoading(
                          view: WebView,
                          request: WebResourceRequest
                      ): Boolean {
                          // Keep navigation strictly inside local bundled game assets.
                          return request.url.host != "appassets.androidplatform.net"
                      }
                  }

                  setContentView(webView)
                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html")

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          val now = System.currentTimeMillis()
                          if (now - lastBackPressedMs < 2000L) {
                              finish()
                          } else {
                              lastBackPressedMs = now
                              Toast.makeText(
                                  this@MainActivity,
                                  "Press back again to exit",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                  })
              }

              private fun hideSystemBars() {
                  val controller = WindowInsetsControllerCompat(window, window.decorView)
                  controller.systemBarsBehavior =
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  controller.hide(WindowInsetsCompat.Type.systemBars())
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      hideSystemBars()
                  }
              }

              override fun onPause() {
                  webView.onPause()
                  webView.pauseTimers()
                  super.onPause()
              }

              override fun onResume() {
                  super.onResume()
                  webView.resumeTimers()
                  webView.onResume()
              }

              override fun onDestroy() {
                  webView.destroy()
                  super.onDestroy()
              }
          }
          EOF_MAIN_KT

            python3 - "$BUILD_DIR" <<'EOF_ICON'
          import os, sys, struct, zlib
          root = sys.argv[1]
          def make_icon(path, size=144):
              bg = (11, 13, 22, 255)
              frame = (19, 25, 43, 255)
              gold = (245, 184, 46, 255)
              blade = (226, 232, 240, 255)
              raw = bytearray()
              for y in range(size):
                  raw.append(0)
                  for x in range(size):
                      in_box = 10 <= x < size - 10 and 10 <= y < size - 10
                      on_diag1 = abs(x - y) < 10 and 24 <= x <= size - 24
                      on_diag2 = abs((size - 1 - x) - y) < 10 and 24 <= x <= size - 24
                      in_gem = abs(x - size // 2) < 14 and abs(y - size // 2) < 14
                      if in_gem:
                          c = gold
                      elif on_diag1 or on_diag2:
                          c = blade
                      elif in_box:
                          c = frame
                      else:
                          c = bg
                      raw.extend(c)
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)
          mipmap_dir = os.path.join(root, "app/src/main/res/mipmap-xxhdpi")
          make_icon(os.path.join(mipmap_dir, "ic_launcher.png"))
          make_icon(os.path.join(mipmap_dir, "ic_launcher_round.png"))
          EOF_ICON
          fi

          echo "APK_BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          ls -la "$BUILD_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Generate offline APK signing keystore
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias pixellane \
            -storepass pixellane123 \
            -keypass pixellane123 \
            -dname "CN=Pixel Lane MOBA, OU=Mobile, O=Offline Build, L=Web, ST=NA, C=US"

      - name: Compile Signed Release & Debug APKs
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare named APK files
        run: |
          mkdir -p dist-apk
          cp "${{ env.APK_BUILD_DIR }}/app/build/outputs/apk/release/app-release.apk" "dist-apk/pixel-lane-moba-v1.0.0-release.apk"
          cp "${{ env.APK_BUILD_DIR }}/app/build/outputs/apk/debug/app-debug.apk" "dist-apk/pixel-lane-moba-v1.0.0-debug.apk"
          ls -lh dist-apk/

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixel-lane-moba-v1.0.0-apk
          path: dist-apk/*.apk
          retention-days: 30

      - name: Publish direct APK download to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: "Pixel Lane MOBA v1.0.0 (Build #${{ github.run_number }})"
          body: |
            Offline Android APK compiled automatically by GitHub Actions.
            - **Direct install**: Download `pixel-lane-moba-v1.0.0-release.apk` onto your Android device and tap to install.
            - **Package ID**: `com.pixellane.moba`
            - **Offline Mode**: Zero network permissions required (100% offline)
          files: |
            dist-apk/pixel-lane-moba-v1.0.0-release.apk
            dist-apk/pixel-lane-moba-v1.0.0-debug.apk
